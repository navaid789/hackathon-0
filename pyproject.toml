[project]
name = "autoops-ai"
version = "1.0.0"
description = "Autonomous AI Email Operations Assistant — Hackathon Project"
authors = [{ name = "navaid789" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "flask>=3.0.0",
    "schedule>=1.2.0",
    "watchdog>=4.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
]

[project.scripts]
autoops = "run_system:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "httpx>=0.27.0",
]
